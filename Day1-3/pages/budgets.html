<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgets · Ledger</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800">
  <header class="border-b border-slate-200 bg-white"><div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-5 py-4"><a href="expense-dashboard.html" class="text-lg font-bold text-slate-900">Ledger</a><nav class="flex max-w-full gap-1 overflow-x-auto rounded-xl border border-slate-200 bg-slate-50 p-1 text-sm" aria-label="Dashboard pages"><a href="expense-dashboard.html" class="whitespace-nowrap rounded-lg px-4 py-2 font-medium text-slate-500 transition hover:bg-white hover:text-slate-900">Overview</a><a href="transactions.html" class="whitespace-nowrap rounded-lg px-4 py-2 font-medium text-slate-500 transition hover:bg-white hover:text-slate-900">Transactions</a><a href="budgets.html" aria-current="page" class="whitespace-nowrap rounded-lg bg-white px-4 py-2 font-semibold text-sky-700 shadow-sm">Budgets</a></nav></div></header>
  <main class="mx-auto max-w-6xl px-5 py-10">
    <div class="mb-7 flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-semibold uppercase tracking-widest text-sky-700">Plan with confidence</p><h1 class="mt-2 text-3xl font-bold text-slate-900">Monthly budgets</h1><p id="budget-plan-caption" class="mt-2 text-sm text-slate-500">Loading budget data...</p></div><a href="expense-dashboard.html" class="rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-700">← Back to overview</a></div>
    <section class="mb-6 grid gap-4 sm:grid-cols-3" aria-label="Budget summary"><article class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Monthly limit</p><p id="budget-limit" class="mt-2 text-2xl font-bold text-slate-900">?</p></article><article class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Spent so far</p><p id="budget-spent" class="mt-2 text-2xl font-bold text-rose-600">?</p></article><article class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Left to spend</p><p id="budget-remaining" class="mt-2 text-2xl font-bold text-emerald-600">?</p></article></section>
    <section class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-7"><h2 class="mb-6 font-semibold text-slate-900">Category budgets</h2><div id="budget-category-list" class="space-y-6"></div></section>
    <p class="mt-4 text-xs text-slate-400">Category limits load from the shared JSON data file.</p>
  </main> 

  <script src="../assets/js/budgets.js"></script>
</body>
</html>
