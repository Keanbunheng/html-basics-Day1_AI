<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your account."
    />
    <meta name="theme-color" content="#f8fafc" />
    <title>Sign in</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.js"></script>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        background:
          radial-gradient(ellipse at 50% 0%, rgba(191, 219, 254, 0.38), transparent 56%),
          #f8fafc;
      }

      .dot-field {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.72;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

      }
    </style>
  </head>
  <body
    class="relative flex min-h-full items-center justify-center overflow-x-hidden px-4 py-10 font-sans text-slate-800 antialiased"
  >
    <canvas class="dot-field" id="dot-field" aria-hidden="true"></canvas>
    <div
      class="pointer-events-none fixed left-1/2 top-1/3 z-0 h-72 w-72 -translate-x-1/2 rounded-full bg-sky-300/20 blur-3xl"
      aria-hidden="true"
    ></div>

    <main class="relative z-10 w-full max-w-[440px]">
      <a
        href="#sign-in"
        class="mb-8 flex items-center justify-center gap-3 text-sm font-semibold tracking-[0.18em] text-slate-700"
        aria-label="Home"
      >
        <span
          class="grid h-9 w-9 grid-cols-2 gap-1 rounded-xl border border-slate-200 bg-white p-2 shadow-md shadow-slate-200/70"
          aria-hidden="true"
        >
          <span class="rounded-sm bg-sky-300"></span>
          <span class="rounded-sm bg-blue-400/80"></span>
          <span class="rounded-sm bg-blue-500/70"></span>
          <span class="rounded-sm bg-indigo-400"></span>
        </span>
        YOUR WORKSPACE
      </a>

      <section
        id="sign-in"
        class="rounded-2xl border border-slate-200/80 bg-white/95 p-6 shadow-xl shadow-slate-900/[0.06] backdrop-blur-xl sm:p-9"
      >
        <div class="mb-8">
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-sky-700"
          >
            Welcome back
          </p>
          <h1 class="text-3xl font-semibold tracking-tight text-slate-900">
            Sign in to your account
          </h1>
          <p class="mt-2 text-sm leading-6 text-slate-500">
            Enter your details to continue to your workspace.
          </p>
        </div>

        <form id="sign-in-form" class="space-y-5">
          <div>
            <label
              for="email"
              class="mb-2 block text-sm font-medium text-slate-700"
              >Email address</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
              class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10"
            />
          </div>

          <div>
            <div class="mb-2 flex items-center justify-between">
              <label
                for="password"
                class="block text-sm font-medium text-slate-700"
                >Password</label
              >
              <a
                href="#help"
                class="text-xs font-medium text-sky-700 transition hover:text-sky-800"
                >Forgot password?</a
              >
            </div>
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 pr-16 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10"
              />
              <button
                id="toggle-password"
                type="button"
                class="absolute inset-y-0 right-0 px-4 text-xs font-medium text-slate-500 transition hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-sky-500"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <label class="flex cursor-pointer items-center gap-2.5 text-sm text-slate-600">
            <input
              type="checkbox"
              name="remember"
              class="h-4 w-4 rounded border-slate-300 bg-white text-sky-600 accent-sky-600 focus:ring-2 focus:ring-sky-500/30"
            />
            Keep me signed in
          </label>

          <button
            type="submit"
            class="group flex w-full items-center justify-center gap-2 rounded-lg bg-sky-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-900/15 transition hover:bg-sky-700 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-sky-500/25 active:scale-[0.99]"
          >
            Continue
            <svg
              class="h-4 w-4 transition-transform group-hover:translate-x-0.5"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M4.5 10h11m0 0-4.5-4.5M15.5 10 11 14.5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <p
            id="form-message"
            class="min-h-5 text-center text-xs text-slate-500"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <div class="my-5 flex items-center gap-4">
          <span class="h-px flex-1 bg-slate-200"></span>
          <span class="text-xs text-slate-400">SECURE ACCESS</span>
          <span class="h-px flex-1 bg-slate-200"></span>
        </div>

        <p class="text-center text-sm text-slate-500">
          New here?
          <a
            href="#create-account"
            class="ml-1 font-medium text-sky-700 transition hover:text-sky-800"
            >Create an account</a
          >
        </p>
      </section>

      <p class="mt-6 text-center text-xs leading-5 text-slate-500">
        By continuing, you agree to our
        <a href="#terms" class="text-slate-600 underline decoration-slate-300 underline-offset-4 hover:text-slate-900">Terms</a>
        and
        <a href="#privacy" class="text-slate-600 underline decoration-slate-300 underline-offset-4 hover:text-slate-900">Privacy Policy</a>.
      </p>
    </main>

    <script src="../assets/js/sign-in.js"></script>
  </body>
</html>
